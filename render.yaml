```yaml
# render.yaml — versión con Docker

services:
  - type: web
    name: erp-django-utec
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    # El ENTRYPOINT del Dockerfile inicia la aplicación
    healthCheckPath: /

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString

databases:
  - name: erp-django-db
    databaseName: erp_db
    user: erp_user
    plan: free
    region: oregon
```
